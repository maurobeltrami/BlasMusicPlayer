name: "Multi-Platform Zero-Terminal Test (Cloud CI)"

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    name: Test & Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            os_name: "linux"
            args: ""
          - platform: "windows-latest"
            os_name: "windows"
            args: ""
          - platform: "macos-latest"
            os_name: "macos"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # 🧪 Test di conformità "Zero-Terminal" per Linux: verifica librerie dinamiche
      - name: Verify Linux Binary (Zero-Terminal Check)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "=== Verifica presenza pacchetti compilati Linux ==="
          ls -lh src-tauri/target/release/bundle/appimage/ || true
          ls -lh src-tauri/target/release/bundle/deb/ || true
          
          BIN_PATH=$(find src-tauri/target/release -maxdepth 1 -type f -executable | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            echo "Eseguibile trovato: $BIN_PATH"
            echo "=== Controllo dipendenze condivise mancanti (ldd) ==="
            ldd "$BIN_PATH" | grep -i "not found" && { echo "ERRORE: Librerie mancanti!"; exit 1; } || echo "Tutte le librerie di base sono soddisfatte!"
          fi

      # 🧪 Test di conformità per Windows: verifica binari compilati
      - name: Verify Windows Binary (Zero-Terminal Check)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Verifica pacchetti Windows ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter *.exe | Select-Object FullName, Length
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter *.msi | Select-Object FullName, Length

      # 📦 Salva gli eseguibili compilati come Artefatti scaricabili su GitHub
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlasMusicPlayer-${{ matrix.os_name }}-build
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
